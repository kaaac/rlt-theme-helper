name: Create Release package

on:
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npx --yes @vscode/vsce package --out rlt-theme-helper-${{ github.event.release.tag_name }}.vsix

      - name: Upload VSIX as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: rlt-theme-helper-*.vsix
