name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      VSIX: rlt-theme-helper-${{ github.event.release.tag_name }}.vsix

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release tag matches package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} does not match package.json version $VERSION"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Package extension
        run: npx --yes @vscode/vsce package --out "$VSIX"

      # VS Code Marketplace and Open VSX: upload this VSIX manually
      - name: Upload VSIX as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.VSIX }}
